kotlin.code.style=official
org.gradle.configuration-cache=true

# MSI/EXE ProductVersion. Bump this on every release build: jpackage's
# Windows installers only auto-uninstall the previous version in place
# when this number increases; an unchanged version makes Windows Installer
# refuse to reinstall and send the user to Add/Remove Programs instead.
appVersion=1.1.0

# MSIX packaging (packageMsix task, for Microsoft Store submission). Replace these placeholders
# with the values Partner Center gives you after reserving the app's name (Dashboard > app >
# Product identity) - see the packageMsix task in build.gradle.kts for the full setup steps.
msixPackageIdentityName=FrankDerville.SBS3DViewer
msixPublisher=CN=22C4E839-4DCF-4196-84A2-72A7978BAF15
msixPublisherDisplayName=FrankDerville
# Path to makeappx.exe from the locally installed Windows 10/11 SDK - machine-specific (the
# version-numbered folder changes when the SDK is updated), so re-check this path after any SDK
# update: Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory | Sort Name -Descending
msixMakeAppxPath=C:/Program Files (x86)/Windows Kits/10/bin/10.0.28000.0/x64/makeappx.exe
